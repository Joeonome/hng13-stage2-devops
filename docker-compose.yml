version: "3.8"

networks:
  app_network:
    driver: bridge

volumes:
  nginx_logs:   # ✅ Shared volume for Nginx <-> watcher

services:
  nginx:
    image: nginx:alpine
    container_name: nginx_gateway
    networks:
      - app_network
    environment:
      - ACTIVE_POOL=${ACTIVE_POOL}
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf.template:/etc/nginx/templates/nginx.conf.template:ro
      - nginx_logs:/var/log/nginx     # ✅ shared log volume for watcher
    command: >
      /bin/sh -c "envsubst '$$ACTIVE_POOL' < /etc/nginx/templates/nginx.conf.template > /etc/nginx/conf.d/default.conf &&
      nginx -g 'daemon off;'"

  blue:
    image: ${BLUE_IMAGE}
    container_name: app_blue
    networks:
      - app_network
    environment:
      - RELEASE_ID=${RELEASE_ID_BLUE}
      - APP_POOL=${APP_POOL_BLUE}
      - PORT=8081
    expose:
      - "8081"
    ports:
      - "8081:8081"

  green:
    image: ${GREEN_IMAGE}
    container_name: app_green
    networks:
      - app_network
    environment:
      - RELEASE_ID=${RELEASE_ID_GREEN}
      - APP_POOL=${APP_POOL_GREEN}
      - PORT=8082
    expose:
      - "8082"
    ports:
      - "8082:8082"

  # ✅ NEW: Log watcher service for Stage 3
  alert_watcher:
    image: python:3.11-slim
    container_name: alert_watcher
    networks:
      - app_network
    volumes:
      - ./watcher/watcher.py:/app/watcher.py:ro
      - ./nginx_logs:/var/log/nginx
    working_dir: /app
    environment:
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL}
      - ERROR_RATE_THRESHOLD=${ERROR_RATE_THRESHOLD}
      - WINDOW_SIZE=${WINDOW_SIZE}
      - ALERT_COOLDOWN_SEC=${ALERT_COOLDOWN_SEC}
    command: ["python", "/app/watcher/watcher.py"]

