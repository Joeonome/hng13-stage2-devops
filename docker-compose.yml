version: "3.8"

services:
  nginx:
    image: nginx:alpine
    container_name: nginx_gateway
    environment:
      - ACTIVE_POOL=${ACTIVE_POOL}
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf.template:/etc/nginx/templates/nginx.conf.template:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    command: >
      /bin/sh -c "envsubst '$$ACTIVE_POOL' < /etc/nginx/templates/nginx.conf.template > /etc/nginx/conf.d/default.conf &&
      nginx -g 'daemon off;'"

  blue:
    image: ${BLUE_IMAGE}
    container_name: app_blue
    environment:
      - RELEASE_ID=${RELEASE_ID_BLUE}
      - APP_POOL=${APP_POOL_BLUE}
      - PORT=8081
    ports:
      - "8081:8081"

  green:
    image: ${GREEN_IMAGE}
    container_name: app_green
    environment:
      - RELEASE_ID=${RELEASE_ID_GREEN}
      - APP_POOL=${APP_POOL_GREEN}
      - PORT=8082
    ports:
      - "8082:8082"
